<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PluginHub · 统一插件面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232563eb'/%3E%3Cpath d='M20 20h8v8h-8zM36 20h8v8h-8zM20 36h8v8h-8zM36 36h8v8h-8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:10px 20px;background:#1a1a2e;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr h1{font-size:1.1rem;color:#60a5fa}
.hdr .sub{color:#666;font-size:.75rem}
.tabs{display:flex;gap:2px;padding:6px 16px;background:#12121f;border-bottom:1px solid #2a2a4a;flex-shrink:0;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;background:transparent;border:1px solid transparent;border-bottom:none;color:#888;font-size:.85rem;display:flex;align-items:center;gap:6px;transition:.15s;user-select:none;white-space:nowrap}
.tab:hover{background:#1a1a2e;color:#ccc}
.tab.active{background:#1a1a2e;border-color:#2a2a4a;color:#60a5fa}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.g{background:#22c55e;box-shadow:0 0 4px #22c55e66}
.r{background:#ef4444;box-shadow:0 0 4px #ef444466}
.main{flex:1;position:relative;overflow:hidden}
.frame{position:absolute;inset:0}
.frame.hidden{display:none !important}
.frame iframe{width:100%;height:100%;border:none;display:block}
.bar{padding:4px 20px;background:#12121f;border-top:1px solid #2a2a4a;font-size:.65rem;color:#444;display:flex;justify-content:space-between;flex-shrink:0}
.offline{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#888;padding:40px}
.offline h3{color:#ef4444;margin:12px 0 8px;font-size:1.15rem}
.offline p{max-width:560px;line-height:1.7;font-size:.85rem}
.offline .hint{margin-top:14px;color:#666;font-size:.78rem;line-height:1.8;text-align:left;background:#12121f;padding:12px 16px;border-radius:8px;max-width:640px;white-space:pre-wrap;font-family:inherit}
.offline .hint code{font-family:'Cascadia Code','Fira Code',monospace;color:#8ab4f8;background:#0f0f1a;padding:2px 6px;border-radius:4px;font-size:.75rem}
.offline button.ghost{background:transparent;border:1px solid #2a2a4a;color:#9ca3af}
.offline button.ghost:hover{background:#1a1a2e;color:#e0e0e0}
.offline button{margin-top:18px;padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}
.live{height:100%;overflow:auto;padding:22px 26px}
.live h2{font-size:1.15rem;color:#e0e0e0;margin-bottom:6px}
.live .note{color:#777;font-size:.78rem;line-height:1.7;margin-bottom:16px;max-width:760px}
.live .open{display:inline-block;margin-bottom:16px;padding:8px 16px;background:#2563eb;color:#fff;border-radius:7px;text-decoration:none;font-size:.82rem}
.live pre{background:#12121f;border-radius:8px;padding:14px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.74rem;line-height:1.55;color:#9aa4b2;white-space:pre-wrap;word-break:break-all;max-height:calc(100% - 160px);overflow:auto}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777;font-size:.9rem}
</style>
</head>
<body>

<div class="hdr">
  <h1>🔌 PluginHub</h1>
  <span class="sub" id="header-sub">加载中…</span>
</div>

<div class="tabs" id="tabs-container"></div>
<div class="main" id="frames-container"><div class="empty">正在连接插件…</div></div>
<div class="bar">
  <span id="proxy-info">connectors/</span>
  <span id="ts">--:--:--</span>
</div>

<script>
var CONNECTORS = [];

function init() {
  fetch('/api/config').then(function (r) { return r.json() }).then(function (cfg) {
    CONNECTORS = cfg.connectors || [];
    document.getElementById('proxy-info').textContent =
      CONNECTORS.length + ' 个连接器 · 契约驱动（connectors/*.yaml）';
    render();
    document.getElementById('ts').textContent = new Date().toLocaleTimeString();
  }).catch(function (e) {
    document.getElementById('header-sub').textContent = '加载配置失败: ' + e.message;
    document.getElementById('frames-container').innerHTML =
      '<div class="empty">无法读取 /api/config：' + esc(e.message) + '</div>';
  });
}

function activeId() {
  var m = /[?&]tab=([^&]+)/.exec(location.search);
  if (m) return decodeURIComponent(m[1]);
  return CONNECTORS.length ? CONNECTORS[0].id : '';
}

function render() {
  var cur = activeId();
  var tabs = '';
  var frames = '';

  for (var i = 0; i < CONNECTORS.length; i++) {
    var c = CONNECTORS[i];
    var tip = (c.endpoint || (c.mode === 'mcp' ? 'MCP stdio' : '未发现')) +
              (c.endpointSource ? ' · 来源: ' + c.endpointSource : '');
    tabs += '<div class="tab' + (c.id === cur ? ' active' : '') + '" data-id="' + esc(c.id) + '"' +
            ' title="' + esc(tip) + '"' +
            ' onclick="switchTab(\'' + esc(c.id) + '\', this)">' +
            '<span>' + c.icon + '</span> ' + esc(c.name) +
            '<span class="dot ' + (c.online ? 'g' : 'r') + '" title="' +
            (c.online ? 'Online' : 'Offline') + '"></span></div>';

    frames += '<div id="f-' + esc(c.id) + '" class="frame' + (c.id === cur ? '' : ' hidden') + '">';
    if (!c.online) {
      frames += '<div class="offline"><div style="font-size:3rem">' + c.icon + '</div>' +
                '<h3>' + esc(c.name) + ' 未连接</h3>' +
                '<p>' + esc(c.error || '未在本机发现该插件') + '</p>';
      if (c.launchHint) {
        frames += '<div class="hint">启动命令：<code>' + esc(c.launchHint) + '</code><br>' +
                  'PluginHub 会在本机拉起这个命令，然后等它的指纹接口就绪。</div>';
      } else if (c.offlineHint) {
        frames += '<div class="hint">' + esc(c.offlineHint) + '</div>';
      }
      if (c.canLaunch) {
        frames += '<button id="launch-' + esc(c.id) + '" onclick="launchConnector(\'' + esc(c.id) + '\')">▶ 启动</button>';
      }
      frames += '<button class="ghost" onclick="rediscover()" style="margin-left:8px">🔄 重新扫描本机</button>';
      frames += '<div id="launchmsg-' + esc(c.id) + '" class="hint" style="display:none"></div>';
      frames += '</div>';
    } else if (c.mode === 'iframe' || c.mode === 'mcp' || c.mode === 'static') {
      frames += '<iframe src="' + esc(c.url) + '" title="' + esc(c.name) + '"></iframe>';
    } else {
      frames += '<div class="live"><h2>' + c.icon + ' ' + esc(c.name) + '</h2>' +
                '<div class="note">该连接器没有声明 <code>panelPath</code>，以原始 JSON 形式展示上游响应。</div>' +
                (c.openUrl ? '<a class="open" href="' + esc(c.openUrl) + '" target="_blank" rel="noopener">打开上游界面 ↗</a>' : '') +
                '<pre id="live-' + esc(c.id) + '">加载中…</pre></div>';
    }
    frames += '</div>';
  }

  document.getElementById('tabs-container').innerHTML = tabs;
  document.getElementById('frames-container').innerHTML = frames;

  for (var j = 0; j < CONNECTORS.length; j++) {
    var q = CONNECTORS[j];
    if (q.online && q.mode !== 'iframe') loadLive(q);
  }
  updateHeader();
}

function loadLive(c) {
  var box = document.getElementById('live-' + c.id);
  if (!box) return;
  fetch(c.url).then(function (r) { return r.text() }).then(function (t) {
    var out = t;
    try { out = JSON.stringify(JSON.parse(t), null, 2) } catch (e) { /* keep raw */ }
    box.textContent = out;
  }).catch(function (e) {
    box.textContent = 'Error: ' + e.message;
  });
}

function switchTab(id, el) {
  var frames = document.querySelectorAll('.frame');
  for (var i = 0; i < frames.length; i++) frames[i].classList.add('hidden');
  var target = document.getElementById('f-' + id);
  if (target) target.classList.remove('hidden');
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  if (el) el.classList.add('active');
  if (history.replaceState) history.replaceState(null, '', '?tab=' + encodeURIComponent(id));
}

function setLaunchMsg(id, text, isError) {
  var el = document.getElementById('launchmsg-' + id);
  if (!el) return;
  el.style.display = 'block';
  el.style.color = isError ? '#fca5a5' : '#86efac';
  el.textContent = text;
}

function launchConnector(id) {
  var btn = document.getElementById('launch-' + id);
  if (btn) { btn.disabled = true; btn.textContent = '启动中…'; }
  setLaunchMsg(id, '正在执行启动命令并等待就绪…', false);

  fetch('/api/launch/' + encodeURIComponent(id), { method: 'POST' })
    .then(function (r) { return r.json() })
    .then(function (d) {
      if (d.ok) {
        setLaunchMsg(id, '已启动' + (d.origin ? ' → ' + d.origin : '') +
                    (d.waitedMs ? '（' + Math.round(d.waitedMs / 1000) + 's）' : '') + '，刷新中…', false);
        setTimeout(function () { location.reload() }, 1200);
      } else {
        var msg = '启动失败：' + (d.error || '未知错误');
        if (d.stderr) msg += '\n' + d.stderr;
        setLaunchMsg(id, msg, true);
        if (btn) { btn.disabled = false; btn.textContent = '▶ 启动'; }
      }
    })
    .catch(function (e) {
      setLaunchMsg(id, '请求失败：' + e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = '▶ 启动'; }
    });
}

function rediscover() {
  fetch('/api/rediscover', { method: 'POST' })
    .then(function (r) { return r.json() })
    .then(function () { location.reload() })
    .catch(function () { location.reload() });
}

function showEndpoint(el, c) {
  var parts = [];
  if (c.endpoint) parts.push(c.endpoint);
  if (c.endpointSource) parts.push('来源: ' + c.endpointSource);
  el.title = parts.join('  ·  ');
}

function updateHeader() {
  var online = 0;
  for (var i = 0; i < CONNECTORS.length; i++) if (CONNECTORS[i].online) online++;
  document.getElementById('header-sub').textContent =
    '契约驱动 · 插件自带面板直嵌 · ' + online + '/' + CONNECTORS.length + ' 在线';
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
setInterval(function () {
  for (var i = 0; i < CONNECTORS.length; i++) {
    if (CONNECTORS[i].online && CONNECTORS[i].mode !== 'iframe') loadLive(CONNECTORS[i]);
  }
}, 20000);
</script>
</body>
</html>
