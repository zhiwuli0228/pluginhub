# Connector: dsh-env-manager (hosted inside DSH)
#
# Same story as token-usage-statistic: the routes live on the DSH web server, so
# the origin is discovered rather than configured. Its API also requires a
# request header, injected at the proxy layer.
#
# Deliberately NO `launch`: starting the endpoint would mean starting DSH
# itself, which is the user's call, not PluginHub's.

id: dsh-env-manager
name: 环境管理器
icon: "🔧"

upstream: auto

discover:
  env:
    - DSH_WEB_URL
  probe:
    # The panel page is unique to this plugin, so a marker in its HTML is a
    # strong fingerprint.
    path: /env-manager/panel
    method: GET
    expectStatus: 200
    expectBodyContains: 环境管理器

offlineHint: 需要先启动 DSH（Web 或桌面版）。该插件的路由挂在 DSH 的 webServer 上，PluginHub 不会代为拉起宿主。

panelPath: /env-manager/panel

pathPrefixes:
  - /env-manager/

# Header the plugin's API requires on every request.
injectHeaders:
  x-env-manager-request: "1"
