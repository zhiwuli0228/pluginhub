# Connector: dsh-env-manager
#
# Tier 0 contract — the plugin serves its own panel page (`/env-manager/panel`,
# added in 0.2.0). Its API additionally requires a request header, injected at
# the proxy layer.

id: dsh-env-manager
name: 环境管理器
icon: "🔧"

upstream: http://127.0.0.1:62724

panelPath: /env-manager/panel

pathPrefixes:
  - /env-manager/

health:
  path: /env-manager/panel
  method: GET

# Header the plugin's API requires on every request.
injectHeaders:
  x-env-manager-request: "1"

openUrl: http://127.0.0.1:62724/
