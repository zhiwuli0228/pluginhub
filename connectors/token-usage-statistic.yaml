# Connector: token-usage-statistic (hosted inside DSH)
#
# The plugin has no process of its own: its routes are mounted on the DSH web
# server, whose port changes on every restart. So the port is never written
# down — PluginHub reads DSH_WEB_URL when present, otherwise scans this
# machine's listening ports and fingerprints the token-usage API.

id: token-usage-statistic
name: Token 用量统计
icon: "📊"

upstream: auto

discover:
  env:
    - DSH_WEB_URL
  probe:
    path: /token-usage-statistic/api/summary?days=1
    method: GET
    expectStatus: 200
    expectJsonKey: totals

launch:
  # Starting the endpoint means starting its host. Opt-in: only runs when the
  # user clicks 启动 and nothing was discovered.
  command: dsh
  args:
    - web
  shell: true
  readyTimeoutMs: 90000

panelPath: /token-usage-statistic/panel

pathPrefixes:
  - /token-usage-statistic/
